name: Sondagem de fontes (temporário)

# Só lê e imprime no log. Será apagado depois.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/sondagem.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resultado trimestral de KNRI11 e HGLG11, coluna a coluna
        run: |
          curl -sSf -m 120 -o it.zip "https://dados.cvm.gov.br/dados/FII/DOC/INF_TRIMESTRAL/DADOS/inf_trimestral_fii_2026.zip"
          curl -sSf -m 120 -o it25.zip "https://dados.cvm.gov.br/dados/FII/DOC/INF_TRIMESTRAL/DADOS/inf_trimestral_fii_2025.zip"
          unzip -o -q it.zip; mkdir -p a25; unzip -o -q it25.zip -d a25
          python3 - <<'PY'
          import csv, io
          def ler(p): return list(csv.DictReader(io.open(p, encoding='latin1'), delimiter=';'))
          geral = ler('inf_trimestral_fii_geral_2026.csv')
          alvo = {g['CNPJ_Fundo_Classe']: g['Codigo_ISIN'] for g in geral if g['Codigo_ISIN'] in ('BRKNRICTF007', 'BRHGLGCTF004')}
          print('CNPJs:', alvo)
          for ano, pasta in (('2025', 'a25/'), ('2026', '')):
              res = ler(f'{pasta}inf_trimestral_fii_resultado_contabil_financeiro_{ano}.csv')
              for cnpj in alvo:
                  linhas = sorted((r for r in res if r['CNPJ_Fundo_Classe'] == cnpj), key=lambda r: (r['Data_Referencia'], r['Versao']))
                  print(f'== {alvo[cnpj]} {ano}: trimestres', [r['Data_Referencia'] + ' v' + r['Versao'] for r in linhas])
                  for col in linhas[0].keys() if linhas else []:
                      vals = [r[col] for r in linhas]
                      if any(v not in ('', '0') for v in vals) and col not in ('CNPJ_Fundo_Classe',):
                          print(f'   {col}: {vals}')
          imov = ler('inf_trimestral_fii_imovel_2026.csv')
          for cnpj in alvo:
              u = [r for r in imov if r['CNPJ_Fundo_Classe'] == cnpj]
              dt = max(r['Data_Referencia'] for r in u) if u else None
              print(f'== imóveis {alvo[cnpj]} {dt}:', len([r for r in u if r['Data_Referencia'] == dt]), 'classes', sorted({r['Classe'] for r in u}))
              for r in [r for r in u if r['Data_Referencia'] == dt][:4]: print('   ', r['Nome_Imovel'][:40], r['Percentual_Vacancia'], r['Percentual_Inadimplencia'], r['Percentual_Receitas_FII'])
          PY

      - name: B3 rendimentos de KNRI e HGLG (para conferir com a CVM)
        run: |
          for f in KNRI HGLG; do
            q=$(printf '{"typeFund":7,"cnpj":"0","identifierFund":"%s"}' "$f" | base64 -w0)
            curl -sS -m 60 -A "Mozilla/5.0" "https://sistemaswebb3-listados.b3.com.br/fundsProxy/fundsCall/GetListedSupplementFunds/$q" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print('$f', [(x['relatedTo'], x['lastDatePrior'], x['rate'], x['isinCode']) for x in d['cashDividends'] if x['isinCode'].endswith(('CTF007','CTF004'))][:14])"
          done
