name: Sondagem de fontes (temporário)

# Só lê e imprime no log: tabela oficial de tarifas de renda variável da B3. Será apagado depois.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/sondagem.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Seções completas (escopo, TTA, arredondamento)
        run: |
          which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          curl -sSL -m 120 -A "Mozilla/5.0" -o d1.pdf "https://b3.com.br/data/files/8D/10/AA/8A/964599100A29E189AC094EA8/Tarifacao_Equities_V3_PT.pdf"
          pdftotext -layout d1.pdf d1.txt
          echo "=== 1 a 1.2.5 (escopo, CCP, TTA)"; sed -n 160,410p d1.txt
          n=$(grep -n "4.2.1 Tarifa de Transfer" d1.txt | tail -1 | cut -d: -f1); echo "=== 4.2.1 (linha $n)"; sed -n "$n,$((n+70))p" d1.txt
          echo "=== arredondamento"; grep -n -i -B2 -A3 "arredond\|truncad\|casas decimais\|valor m[ií]nimo" d1.txt | head -60
      - name: Valor da TTA vigente em 2026 (busca nos comunicados)
        run: |
          for q in "tarifa%20de%20transfer%C3%AAncia%20de%20ativos%202026" "TTA%202026"; do
            curl -sSL -m 60 -A "Mozilla/5.0" "https://www.b3.com.br/pt_br/busca/?q=$q" -o b.html -w "busca HTTP %{http_code}\n" || true
            grep -o 'href="[^"]*\.pdf"' b.html | head -10 || true
          done
