name: Sondagem de fontes (temporário)

# Só lê e imprime no log. Será apagado depois.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/sondagem.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: WEGE na B3 (todos os proventos)
        run: |
          q=$(printf '{"issuingCompany":"WEGE","language":"pt-br"}' | base64 -w0)
          curl -sS -m 60 -A "Mozilla/5.0" "https://sistemaswebb3-listados.b3.com.br/listedCompaniesProxy/CompanyCall/GetListedSupplementCompany/$q" \
            | python3 -c "import json,sys; d=json.load(sys.stdin)[0]; [print(x['lastDatePrior'], x['paymentDate'], x['label'], x['rate'], x['relatedTo'], x['approvedOn'], x['isinCode'], x['remarks']) for x in d['cashDividends']]"
      - name: BTLG e BROF na B3 x CVM
        run: |
          for f in BTLG BROF; do
            q=$(printf '{"typeFund":7,"cnpj":"0","identifierFund":"%s"}' "$f" | base64 -w0)
            echo "== $f B3"
            curl -sS -m 60 -A "Mozilla/5.0" "https://sistemaswebb3-listados.b3.com.br/fundsProxy/fundsCall/GetListedSupplementFunds/$q" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print('qtd', d.get('quantity')); [print(x['lastDatePrior'], x['label'], x['rate'], x['relatedTo'], x['isinCode']) for x in d['cashDividends'][:10]]"
          done
          curl -sSf -m 120 -o m.zip https://dados.cvm.gov.br/dados/FII/DOC/INF_MENSAL/DADOS/inf_mensal_fii_2026.zip && unzip -o -q m.zip
          python3 - <<'PY'
          import csv, io
          ler = lambda p: list(csv.DictReader(io.open(p, encoding='latin1'), delimiter=';'))
          g = {x['Codigo_ISIN']: x['CNPJ_Fundo_Classe'] for x in ler('inf_mensal_fii_geral_2026.csv') if x['Codigo_ISIN'] in ('BRBTLGCTF000', 'BRBROFCTF006')}
          print('cnpj', g)
          comp = ler('inf_mensal_fii_complemento_2026.csv')
          for isin, cnpj in g.items():
              print('== CVM', isin)
              for x in sorted((x for x in comp if x['CNPJ_Fundo_Classe'] == cnpj), key=lambda x: (x['Data_Referencia'], x['Versao']))[-8:]:
                  print(x['Data_Referencia'], 'v' + x['Versao'], 'VPA', x['Valor_Patrimonial_Cotas'], 'DY', x['Percentual_Dividend_Yield_Mes'], 'cotas', x['Cotas_Emitidas'])
          PY
