name: Sondagem de fontes (temporário)

# Só lê e imprime no log. Será apagado depois.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/sondagem.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: B3 empresa - chaves, eventos em ações e alcance do histórico
        run: |
          for emp in BBAS ITSA MGLU PETR WEGE; do
            q=$(printf '{"issuingCompany":"%s","language":"pt-br"}' "$emp" | base64 -w0)
            curl -sS -m 60 -A "Mozilla/5.0" "https://sistemaswebb3-listados.b3.com.br/listedCompaniesProxy/CompanyCall/GetListedSupplementCompany/$q" > $emp.json
            python3 - "$emp" <<'PY'
          import json,sys
          e=sys.argv[1]; d=json.load(open(e+'.json'))
          d=d[0] if isinstance(d,list) else d
          print('==',e,'chaves:',list(d.keys()))
          cd=d.get('cashDividends') or []
          datas=sorted(x['lastDatePrior'][-4:]+x['lastDatePrior'][3:5] for x in cd)
          print('  cashDividends:',len(cd),'de',datas[:1],'a',datas[-1:], 'labels:',sorted({x['label'] for x in cd}))
          for k in ('stockDividends','subscriptions'):
              v=d.get(k) or []; print('  '+k+':',len(v)); [print('   ',x) for x in v[:6]]
          PY
          done

      - name: B3 FII - outro fundo e chaves
        run: |
          q=$(printf '{"typeFund":7,"cnpj":"0","identifierFund":"KNRI"}' | base64 -w0)
          curl -sS -m 60 -A "Mozilla/5.0" "https://sistemaswebb3-listados.b3.com.br/fundsProxy/fundsCall/GetListedSupplementFunds/$q" > f.json
          python3 -c "
          import json; d=json.load(open('f.json')); print('chaves:',list(d.keys())); cd=d.get('cashDividends') or []
          print('cash:',len(cd), sorted({x['lastDatePrior'][-4:] for x in cd})); print('stock:',(d.get('stockDividends') or [])[:3]); print('qtd:',d.get('quantity'))"

      - name: B3 ritmo (40 requisições seguidas)
        run: |
          t0=$(date +%s); for emp in ABEV AZUL B3SA BBDC BRFS CMIG CPLE CSAN CSNA CYRE ELET EMBR ENEV EQTL GGBR GOAU HAPV ITUB JBSS KLBN LREN MRFG MRVE MULT NTCO PRIO RADL RAIL RDOR RENT SANB SBSP SUZB TAEE TIMS TOTS UGPA USIM VIVT VALE; do
            q=$(printf '{"issuingCompany":"%s","language":"pt-br"}' "$emp" | base64 -w0)
            curl -sS -m 60 -A "Mozilla/5.0" -o /dev/null -w "%{http_code} " "https://sistemaswebb3-listados.b3.com.br/listedCompaniesProxy/CompanyCall/GetListedSupplementCompany/$q"
          done; echo; echo "segundos: $(( $(date +%s) - t0 ))"

      - name: CVM dicionário do informe trimestral (resultado e imóvel)
        run: |
          curl -sSf -m 120 -o m.zip https://dados.cvm.gov.br/dados/FII/DOC/INF_TRIMESTRAL/META/meta_inf_trimestral_fii.zip && unzip -o -q m.zip && ls
          for f in *.txt; do iconv -f latin1 -t utf-8 "$f" > "u_$f" 2>/dev/null || cp "$f" "u_$f"; done
          echo "== resultado: campos de distribuição, FFO e rendimentos"; grep -h -i -B1 -A3 "Rendimento\|Distribu\|Resultado_Liquido_Total_Financeiro\|Receita_Venda_Investimento_Financeiro\|Percentual_Resultado" u_*resultado* | head -80
          echo "== imóvel"; grep -h -i -A3 "Percentual_Vacancia\|Percentual_Receitas_FII\|Classe" u_*imovel_2* u_*imovel.* 2>/dev/null | head -40
          ls u_*
