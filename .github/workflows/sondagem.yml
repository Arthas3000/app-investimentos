name: Sondagem de fontes (temporário)

# Só o robots.txt (feito para robôs) e seus cabeçalhos completos. Não acessa páginas protegidas. Será apagado depois.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/sondagem.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: robots.txt e cabeçalhos completos
        run: |
          curl -sS -m 30 -D h.txt -o r.txt https://app.monexahub.com/robots.txt -w "HTTP %{http_code}\n"
          echo "== cabeçalhos"; cat h.txt
          echo "== CSP, uma diretiva por linha"; grep -i '^content-security-policy' h.txt | cut -d: -f2- | tr ';' '\n' | sed 's/^ //'
          echo "== robots.txt (sem o texto jurídico)"; grep -v '^#' r.txt | sed '/^\s*$/d'
