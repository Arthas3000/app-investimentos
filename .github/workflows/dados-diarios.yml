name: Dados diários

# Baixa CVM e B3, gera dados/*.json e commita só se algo mudou.
# Dias úteis às 22h UTC (19h de Brasília), depois do fechamento. workflow_dispatch é a válvula de escape.
on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados-diarios
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar dados
        id: gerar
        # O script devolve código 1 se UMA fonte falhar; o que deu certo ainda é commitado e o job fica vermelho no fim.
        continue-on-error: true
        run: node scripts/atualizar-dados.mjs

      - name: Commitar dados/ se mudou
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dados/
          if git diff --cached --quiet; then
            echo 'Nada mudou em dados/.'
          else
            git commit -m "Dados diários: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Sinalizar falha de fonte
        if: steps.gerar.outcome == 'failure'
        run: |
          echo 'Uma ou mais fontes falharam; veja dados/meta.json e o log do passo "Gerar dados".'
          exit 1
